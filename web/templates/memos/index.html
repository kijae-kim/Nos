{% extends "layout_app.html" %}
{% block head_title %}메모 · {{ APP_NAME }}{% endblock %}
{% block header %}
<header class="row-between bar-head">
  <a class="circle" href="{% url 'home' %}" aria-label="뒤로"><svg class="i"><use href="#i-left"/></svg></a>
  <h1 class="bar-title">메모</h1>
  <a class="circle" href="{% url 'memo_new' %}" aria-label="새 메모"><svg class="i"><use href="#i-plus"/></svg></a>
</header>
{% endblock %}
{% block content %}
<h2 class="memo-group-title">폴더</h2>
<ul class="memo-folders card">
  {% for f in folders %}
    <li><a href="{% url 'memo_folder' f.pk %}"><svg class="i"><use href="#i-folder"/></svg><span>{{ f.name }}</span><small>{{ f.count }}</small><svg class="i chev" aria-hidden="true"><use href="#i-right"/></svg></a></li>
  {% endfor %}
</ul>
<a class="add-link" href="{% url 'memo_folder_create' %}"><svg class="i"><use href="#i-plus"/></svg>새 폴더</a>
{% endblock %}
