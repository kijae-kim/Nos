{# 이름표 줄: 누르면 같은 이름표의 일정만 모아 본다. 다시 누르면 풀린다. #}
{% if labels %}
  <nav class="label-strip" aria-label="이름표로 모아 보기">
    {% for l in labels %}
      {% if label and label.pk == l.pk %}
        <a class="label-chip on" style="--c: var(--{{ l.color }})" href="?month={{ month_param }}" aria-current="true">{{ l.token }}<svg class="i" aria-hidden="true"><use href="#i-close"/></svg></a>
      {% else %}
        <a class="label-chip" style="--c: var(--{{ l.color }})" href="?label={{ l.pk }}">{{ l.token }}</a>
      {% endif %}
    {% endfor %}
    <a class="label-chip manage" href="{% url 'labels' %}">이름표 관리</a>
  </nav>
{% else %}
  <nav class="label-strip" aria-label="이름표"><a class="label-chip manage" href="{% url 'labels' %}">이름표 만들기</a></nav>
{% endif %}
