{% load socialaccount %}
{% get_providers as providers %}
{% if providers %}
<div class="divider"><span>또는</span></div>
{% for provider in providers %}
<form method="post" action="{% provider_login_url provider %}">
  {% csrf_token %}
  <button type="submit" class="btn social {{ provider.id }}">
    {% if provider.id == "kakao" %}카카오로 계속하기{% elif provider.id == "google" %}Google로 계속하기{% else %}{{ provider.name }}로 계속하기{% endif %}
  </button>
</form>
{% endfor %}
{% endif %}
