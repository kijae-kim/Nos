{% extends "base.html" %}
{% block body %}
<main class="auth">
  <a class="brand" href="/">{{ APP_NAME }}</a>
  {% if messages %}
    {% for message in messages %}<p class="notice">{{ message }}</p>{% endfor %}
  {% endif %}
  <div class="card auth-card">
    {% block content %}{% endblock %}
  </div>
</main>
{% endblock %}
